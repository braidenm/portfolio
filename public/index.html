<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F33" />
    <meta
      name="description"
      content="Braiden Miller is a senior software engineer who helps product managers and engineering teams turn complex platform work into clear plans, reliable systems, and faster delivery."
    />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.braidenmiller.com/">
    <meta property="og:title" content="Braiden Miller | Senior Software Engineer">
    <meta property="og:description" content="Collaboration-forward senior engineering across product strategy, distributed systems, and reliable delivery.">
    <meta property="og:image" content="https://www.braidenmiller.com/images/mountain.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.braidenmiller.com/">
    <meta property="twitter:title" content="Braiden Miller | Senior Software Engineer">
    <meta property="twitter:description" content="Collaboration-forward senior engineering across product strategy, distributed systems, and reliable delivery.">
    <meta property="twitter:image" content="https://www.braidenmiller.com/images/mountain.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #2F6FAF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <title>Braiden Miller | Senior Software Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
